<line x1="380" y1="1170" x2="1160" y2="1170" stroke="#333" stroke-width="1.4"  marker-end="url(#arrowSolid)"/>
<text x="770.0" y="1164" font-size="13" text-anchor="middle">whole file → quarantine, reason code</text>
<line x1="380" y1="1214" x2="120" y2="1214" stroke="#333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>
