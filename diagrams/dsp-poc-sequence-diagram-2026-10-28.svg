<text x="380" y="1893.0" font-size="12.5" text-anchor="middle">Parquet zstd, 1 file per</text>
<text x="380" y="1909.0" font-size="12.5" text-anchor="middle">publisher per hour</text>
<rect x="550.0" y="1858" width="180" height="60" rx="6" fill="#E8E8E8" stroke="#333333" stroke-width="1.5" stroke-dasharray="6,4"/>
