<text x="640" y="1893.0" font-size="12.5" text-anchor="middle">Output B: events</text>
<text x="640" y="1909.0" font-size="12.5" text-anchor="middle">(time-boxed trial)</text>
<rect x="810.0" y="1858" width="180" height="60" rx="6" fill="#CFE8FF" stroke="#2A6FB0" stroke-width="1.5" />
<text x="900" y="1885.0" font-size="12.5" text-anchor="middle">Step Functions</text>
<text x="900" y="1901.0" font-size="12.5" text-anchor="middle">(continued)</text>
