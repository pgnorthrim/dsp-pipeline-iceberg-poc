<line x1="380" y1="1274" x2="900" y2="1274" stroke="#333" stroke-width="1.4"  marker-end="url(#arrowSolid)"/>
<text x="640.0" y="1268" font-size="13" text-anchor="middle">write ledger file: ALL rows, before filtering</text>
<path d="M 310 1304 L 960 1304 L 970 1314 L 970 1346 L 310 1346 Z" fill="#FFFBE6" stroke="#C9A227" stroke-width="1"/>
<text x="318" y="1321" font-size="11.5">ledger row = transaction_id, raw publisher label, row hash, source_file, event_ts</text>
<text x="318" y="1337" font-size="11.5">Seeded once with ~40M historical ids (monthly files, sorted by transaction_id).</text>
<path d="M 388 1374 L 430 1374 L 430 1392 L 388 1392" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arrowSolid)"/>
<text x="437" y="1387" font-size="13" text-anchor="start">2  clean up; collapse exact duplicates (D3)</text>
<path d="M 388 1418 L 430 1418 L 430 1436 L 388 1436" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arrowSolid)"/>
<text x="437" y="1431" font-size="13" text-anchor="start">    same id, different data → conflict (D4)</text>
<line x1="380" y1="1462" x2="900" y2="1462" stroke="#333" stroke-width="1.4"  marker-end="url(#arrowSolid)"/>
<text x="640.0" y="1456" font-size="13" text-anchor="middle">3  semi-join this hour's ids (window: config, default full history)</text>
<line x1="900" y1="1506" x2="380" y2="1506" stroke="#333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>
<text x="640.0" y="1500" font-size="13" text-anchor="middle">ids seen on other rows, any publisher (excl. same source_file)</text>
<line x1="380" y1="1550" x2="1160" y2="1550" stroke="#333" stroke-width="1.4"  marker-end="url(#arrowSolid)"/>
<text x="770.0" y="1544" font-size="13" text-anchor="middle">conflicts + reused ids → failed-keys/, reason code (D4, D5)</text>
<path d="M 388 1594 L 430 1594 L 430 1612 L 388 1612" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arrowSolid)"/>
<text x="437" y="1607" font-size="13" text-anchor="start">4  drop Test Account + blank publisher; map 9 labels → 6 (D6)</text>
<path d="M 388 1638 L 430 1638 L 430 1656 L 388 1656" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arrowSolid)"/>
<text x="437" y="1651" font-size="13" text-anchor="start">    key = &lt;publisher&gt;-&lt;transaction_id&gt;; drop os_code, make_id (D1, D2, D10)</text>
<path d="M 10 906 L 68 906 L 68 924 L 60 932 L 10 932 Z" fill="#F0F0F0" stroke="#666" stroke-width="1"/><text x="18" y="924" font-size="11" font-weight="bold">loop</text>
<rect x="74" y="912" width="392.40000000000003" height="16"  fill="white" stroke="none" stroke-width="0" />
<text x="78" y="924" font-size="11" text-anchor="start" font-style="italic">for each hour in hours[] (2 in parallel) → continued in Part 3</text>
<path d="M 310 1684 L 1220 1684 L 1230 1694 L 1230 1742 L 310 1742 Z" fill="#FDECEC" stroke="#B03A3A" stroke-width="1"/>
<text x="318" y="1701" font-size="11.5">OPEN: parallel hours can each miss an id that appears in the other.</text>
<text x="318" y="1717" font-size="11.5">Fix (Paul, #4): run step 3 once over the batch of hours, or concurrency 1 for that step.</text>
<text x="318" y="1733" font-size="11.5">Fargate: if Phase 0 says an hour is too big for Lambda, the same image runs as an ECS task.</text>
<text x="20" y="1828" font-size="14" text-anchor="start" font-weight="bold">Part 3 — Writers (A first, B second) and manifest</text>
<rect x="30.0" y="1858" width="180" height="60" rx="6" fill="#CFE8FF" stroke="#2A6FB0" stroke-width="1.5" />
