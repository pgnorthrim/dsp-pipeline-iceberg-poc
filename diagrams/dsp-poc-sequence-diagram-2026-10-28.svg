<rect width="1320" height="2464" fill="white"/>
<text x="660.0" y="20" font-size="16" text-anchor="middle" font-weight="bold">DSP v1 Pipeline POC — one scheduled run (DTE-151), draft 2026-10-28</text>
<text x="20" y="66" font-size="14" text-anchor="start" font-weight="bold">Part 1 — Trigger, lock, find work</text>
<rect x="30.0" y="96" width="180" height="60" rx="6" fill="#E8E8E8" stroke="#333333" stroke-width="1.5" />
<text x="120" y="115.0" font-size="12.5" text-anchor="middle">EventBridge Scheduler</text>
<text x="120" y="131.0" font-size="12.5" text-anchor="middle">(hourly stand-in for</text>
<text x="120" y="147.0" font-size="12.5" text-anchor="middle">Node heartbeat)</text>
<rect x="290.0" y="96" width="180" height="60" rx="6" fill="#CFE8FF" stroke="#2A6FB0" stroke-width="1.5" />
<text x="380" y="123.0" font-size="12.5" text-anchor="middle">Step Functions</text>
<text x="380" y="139.0" font-size="12.5" text-anchor="middle">dsp-poc (Standard)</text>
<rect x="550.0" y="96" width="180" height="60" rx="6" fill="#CFE8FF" stroke="#2A6FB0" stroke-width="1.5" />
<text x="640" y="131.0" font-size="12.5" text-anchor="middle">FindWork Lambda</text>
<rect x="810.0" y="96" width="180" height="60" rx="6" fill="#FFF3C4" stroke="#B8960C" stroke-width="1.5" />
<text x="900" y="123.0" font-size="12.5" text-anchor="middle">S3: Input</text>
<text x="900" y="139.0" font-size="12.5" text-anchor="middle">(curated DSP copy, sandbox)</text>
<rect x="1070.0" y="96" width="180" height="60" rx="6" fill="#DFF2DF" stroke="#3C8D3C" stroke-width="1.5" />
<text x="1160" y="123.0" font-size="12.5" text-anchor="middle">S3: Output A</text>
<text x="1160" y="139.0" font-size="12.5" text-anchor="middle">(Parquet contract)</text>
<rect x="290" y="254" width="960" height="80"  fill="none" stroke="#666" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="120" y1="156" x2="120" y2="760" stroke="#999" stroke-width="1.3" stroke-dasharray="5,4" />
<line x1="380" y1="156" x2="380" y2="760" stroke="#999" stroke-width="1.3" stroke-dasharray="5,4" />
<line x1="640" y1="156" x2="640" y2="760" stroke="#999" stroke-width="1.3" stroke-dasharray="5,4" />
<line x1="900" y1="156" x2="900" y2="760" stroke="#999" stroke-width="1.3" stroke-dasharray="5,4" />
<line x1="1160" y1="156" x2="1160" y2="760" stroke="#999" stroke-width="1.3" stroke-dasharray="5,4" />
<rect x="373" y="156" width="14" height="594"  fill="#CFE8FF" stroke="#2A6FB0" stroke-width="1" />
<line x1="120" y1="186" x2="380" y2="186" stroke="#333" stroke-width="1.4"  marker-end="url(#arrowSolid)"/>
<text x="250.0" y="180" font-size="13" text-anchor="middle">StartExecution (hourly, weekdays 07:00-21:00 ET)</text>
<path d="M 388 230 L 430 230 L 430 248 L 388 248" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arrowSolid)"/>
<text x="437" y="243" font-size="13" text-anchor="start">CheckLock: ListExecutions(status = RUNNING)</text>
<path d="M 388 308 L 430 308 L 430 326 L 388 326" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arrowSolid)"/>
<text x="437" y="321" font-size="13" text-anchor="start">Succeed: SkippedAlreadyRunning (overlapping trigger discarded)</text>
<path d="M 290 254 L 341 254 L 341 272 L 333 280 L 290 280 Z" fill="#F0F0F0" stroke="#666" stroke-width="1"/><text x="298" y="272" font-size="11" font-weight="bold">alt</text>
<rect x="347" y="260" width="181.6" height="16"  fill="white" stroke="none" stroke-width="0" />
<text x="351" y="272" font-size="11" text-anchor="start" font-style="italic">another execution is running</text>
<line x1="380" y1="368" x2="640" y2="368" stroke="#333" stroke-width="1.4"  marker-end="url(#arrowSolid)"/>
<text x="510.0" y="362" font-size="13" text-anchor="middle">invoke FindWork</text>
<line x1="640" y1="412" x2="900" y2="412" stroke="#333" stroke-width="1.4"  marker-end="url(#arrowSolid)"/>
<text x="770.0" y="406" font-size="13" text-anchor="middle">list input files, last 21 days</text>
<line x1="900" y1="456" x2="640" y2="456" stroke="#333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>
<text x="770.0" y="450" font-size="13" text-anchor="middle">file-hours (pld_*.csv.gz)</text>
<line x1="640" y1="500" x2="1160" y2="500" stroke="#333" stroke-width="1.4"  marker-end="url(#arrowSolid)"/>
<text x="900.0" y="494" font-size="13" text-anchor="middle">list output keys for those hours</text>
<line x1="1160" y1="544" x2="640" y2="544" stroke="#333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>
<text x="900.0" y="538" font-size="13" text-anchor="middle">files that exist</text>
<path d="M 648 588 L 690 588 L 690 606 L 648 606" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arrowSolid)"/>
<text x="697" y="601" font-size="13" text-anchor="start">keep hours missing any of the 6 publisher files; cap 6</text>
<line x1="640" y1="632" x2="380" y2="632" stroke="#333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>
<text x="510.0" y="626" font-size="13" text-anchor="middle">hours[] (oldest first, max 6)</text>
<path d="M 310 662 L 1220 662 L 1230 672 L 1230 720 L 310 720 Z" fill="#FFFBE6" stroke="#C9A227" stroke-width="1"/>
<text x="318" y="679" font-size="11.5">No separate job state: "done" = all configured publisher files exist + manifest entry.</text>
<text x="318" y="695" font-size="11.5">Empty publisher-hour still gets a zero-row file, or FindWork would pick that hour up forever.</text>
<text x="318" y="711" font-size="11.5">State-machine timeout 25 min, so a stuck run can't hold the lock past the next trigger.</text>
<text x="20" y="806" font-size="14" text-anchor="start" font-weight="bold">Part 2 — Transform each hour (Map, MaxConcurrency 2)</text>
<rect x="30.0" y="836" width="180" height="60" rx="6" fill="#CFE8FF" stroke="#2A6FB0" stroke-width="1.5" />
<text x="120" y="863.0" font-size="12.5" text-anchor="middle">Step Functions</text>
<text x="120" y="879.0" font-size="12.5" text-anchor="middle">(Map state)</text>
<rect x="290.0" y="836" width="180" height="60" rx="6" fill="#CFE8FF" stroke="#2A6FB0" stroke-width="1.5" />
<text x="380" y="863.0" font-size="12.5" text-anchor="middle">Transform Lambda</text>
<text x="380" y="879.0" font-size="12.5" text-anchor="middle">(container: Python + DuckDB)</text>
<rect x="550.0" y="836" width="180" height="60" rx="6" fill="#FFF3C4" stroke="#B8960C" stroke-width="1.5" />
<text x="640" y="863.0" font-size="12.5" text-anchor="middle">S3: Input</text>
<text x="640" y="879.0" font-size="12.5" text-anchor="middle">(hourly CSV, gz)</text>
<rect x="810.0" y="836" width="180" height="60" rx="6" fill="#FFF3C4" stroke="#B8960C" stroke-width="1.5" />
<text x="900" y="855.0" font-size="12.5" text-anchor="middle">S3: Id ledger</text>
<text x="900" y="871.0" font-size="12.5" text-anchor="middle">(Parquet, 1 file/hour,</text>
<text x="900" y="887.0" font-size="12.5" text-anchor="middle">every row's id)</text>
<rect x="1070.0" y="836" width="180" height="60" rx="6" fill="#FBE0E0" stroke="#B03A3A" stroke-width="1.5" />
<text x="1160" y="855.0" font-size="12.5" text-anchor="middle">S3: Quarantine</text>
<text x="1160" y="871.0" font-size="12.5" text-anchor="middle">rhde-quarantine (sandbox)</text>
<text x="1160" y="887.0" font-size="12.5" text-anchor="middle">failed-keys/</text>
<rect x="290" y="1116" width="960" height="124"  fill="none" stroke="#666" stroke-width="1.2" stroke-dasharray="3,3"/>
<rect x="10" y="906" width="1260" height="758"  fill="none" stroke="#666" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="120" y1="896" x2="120" y2="1782" stroke="#999" stroke-width="1.3" stroke-dasharray="5,4" />
