<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" font-family="Liberation Sans, Arial, sans-serif"><defs><marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f43"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker><marker id="arrQ" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b2c2c"/></marker></defs><rect width="1180" height="560" fill="#ffffff"/><text x="590.0" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">DSP POC: one transform, two outputs</text><rect x="30" y="180" width="200" height="120" rx="10" fill="#eef2f6" stroke="#33475b" stroke-width="2"/><text x="130.0" y="208" text-anchor="middle" font-size="17" font-weight="bold" fill="#33475b">Hourly DSP file</text><text x="130.0" y="234" text-anchor="middle" font-size="14" fill="#222">gzipped CSV</text><text x="130.0" y="255" text-anchor="middle" font-size="14" fill="#222">from the source</text><text x="130.0" y="276" text-anchor="middle" font-size="14" fill="#222">account</text><rect x="300" y="160" width="260" height="160" rx="10" fill="#eef2f6" stroke="#33475b" stroke-width="2"/><text x="430.0" y="188" text-anchor="middle" font-size="17" font-weight="bold" fill="#33475b">One transform</text><text x="430.0" y="214" text-anchor="middle" font-size="14" fill="#222">Python + DuckDB, per hour</text><text x="430.0" y="235" text-anchor="middle" font-size="14" fill="#222">clean, map publisher,</text><text x="430.0" y="256" text-anchor="middle" font-size="14" fill="#222">build key, id check</text><text x="430.0" y="277" text-anchor="middle" font-size="14" fill="#222">(same rows to both paths)</text><path d="M230,240 L296,240" fill="none" stroke="#33475b" stroke-width="2.5" marker-end="url(#arrN)"/><rect x="660" y="80" width="230" height="120" rx="10" fill="#e6f4ec" stroke="#1f6f43" stroke-width="2"/><text x="775.0" y="108" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f6f43">Path A: Parquet files</text><text x="775.0" y="134" text-anchor="middle" font-size="14" fill="#222">6 per hour,</text><text x="775.0" y="155" text-anchor="middle" font-size="14" fill="#222">one per publisher</text><text x="775.0" y="176" text-anchor="middle" font-size="14" fill="#222">(whole-file replace)</text><rect x="950" y="80" width="200" height="120" rx="10" fill="#e6f4ec" stroke="#1f6f43" stroke-width="2"/><text x="1050.0" y="108" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f6f43">Warehouse load</text><text x="1050.0" y="134" text-anchor="middle" font-size="14" fill="#222">picks up the files</text><text x="1050.0" y="155" text-anchor="middle" font-size="14" fill="#222">as it does today</text><path d="M560,200 L656,150" fill="none" stroke="#1f6f43" stroke-width="2.5" marker-end="url(#arrA)"/><text x="572" y="160" font-size="14" font-weight="bold" fill="#1f6f43">Path A</text><path d="M890,140 L946,140" fill="none" stroke="#1f6f43" stroke-width="2.5" marker-end="url(#arrA)"/><text x="905" y="230" text-anchor="middle" font-size="14" font-style="italic" fill="#1f6f43">The deliverable: file in, file out</text><rect x="660" y="280" width="230" height="120" rx="10" fill="#fdf3e1" stroke="#8a5a00" stroke-width="2" stroke-dasharray="8 5"/><text x="775.0" y="308" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a5a00">Path B: S3 Tables</text><text x="775.0" y="334" text-anchor="middle" font-size="14" fill="#222">Iceberg 'events' table</text><text x="775.0" y="355" text-anchor="middle" font-size="14" fill="#222">same rows as A</text><rect x="950" y="280" width="200" height="120" rx="10" fill="#fdf3e1" stroke="#8a5a00" stroke-width="2" stroke-dasharray="8 5"/><text x="1050.0" y="308" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a5a00">Compare with A</text><text x="1050.0" y="334" text-anchor="middle" font-size="14" fill="#222">query with Athena</text><text x="1050.0" y="355" text-anchor="middle" font-size="14" fill="#222">or DuckDB:</text><text x="1050.0" y="376" text-anchor="middle" font-size="14" fill="#222">counts, cost, effort</text><path d="M560,280 L656,330" fill="none" stroke="#8a5a00" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrB)"/><text x="572" y="330" font-size="14" font-weight="bold" fill="#8a5a00">Path B</text><path d="M890,340 L946,340" fill="none" stroke="#8a5a00" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrB)"/><text x="905" y="430" text-anchor="middle" font-size="14" font-style="italic" fill="#8a5a00">Time-boxed trial: can never block Path A</text><rect x="300" y="400" width="260" height="110" rx="10" fill="#fbeaea" stroke="#9b2c2c" stroke-width="2"/><text x="430.0" y="428" text-anchor="middle" font-size="17" font-weight="bold" fill="#9b2c2c">Quarantine + manifest</text><text x="430.0" y="454" text-anchor="middle" font-size="14" fill="#222">bad rows/files with a reason;</text><text x="430.0" y="475" text-anchor="middle" font-size="14" fill="#222">a record of every run</text><path d="M430,320 L430,396" fill="none" stroke="#9b2c2c" stroke-width="2.5" marker-end="url(#arrQ)"/><text x="590.0" y="542" text-anchor="middle" font-size="14" fill="#555">Nothing on Path A reads from Path B. If Path B is dropped, Path A is unchanged.</text></svg>